# Netlify deployment config for Prism (TanStack Start on Nitro).
# The `netlify` Nitro preset (pinned in vite.config.ts) generates an SSR
# serverless function under `.netlify/functions-internal/` and serves
# prerendered/static assets from `dist`. Netlify auto-detects functions
# written there; the generated function config (path: "/*", preferStatic:
# true) routes non-static requests to SSR and serves cached assets directly.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# GOOGLE_GENERATIVE_AI_API_KEY must be set in the Netlify dashboard
# (Site settings → Environment variables), NOT committed here.
# It is read at runtime inside the AI clustering server function.
# Get a key at https://aistudio.google.com/apikey
